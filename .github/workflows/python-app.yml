name: Test Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match your tox.ini environment names here
        tox-env: [py310sp111, py310sp115, py314sp116]
        include:
          # Tell GitHub Actions which system Python version is required for each tox environment
          - tox-env: py310sp111
            python-version: '3.10'
          - tox-env: py310sp115
            python-version: '3.10'
          - tox-env: py314sp116
            python-version: '3.14'

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # Automatically caches pip dependencies to speed up future runs
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox

    - name: Run Tox Environment
      run: tox -e ${{ matrix.tox-env }}
